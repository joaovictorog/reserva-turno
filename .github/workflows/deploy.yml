name: Deploy to Cloudflare Pages

on: workflow_dispatch

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify successful tests for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'tests.yml',
              head_sha: context.sha,
              branch: 'main',
              event: 'push',
              per_page: 1,
            });
            const run = data.workflow_runs[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed('Aguarde o workflow Tests concluir com sucesso neste commit.');
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish production build
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=reserva-turno --branch=main
